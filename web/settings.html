<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FieldPilot · settings</title>
<style>
:root{--bg:#0b1310;--panel:#111c18;--panel2:#15231e;--line:#233630;--line2:#2d443c;--ink:#e8f1ec;--ink2:#c3d3ca;--muted:#8aa196;--nv:#76b900;--ok:#3fb37f;--danger:#ef4f4f}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}header b{font-size:19px}header nav{margin-left:auto;display:flex;gap:14px}a{color:var(--ink2);font-size:13px}
main{max-width:640px;margin:18px auto;padding:0 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}input{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:8px;font:13px ui-monospace,Consolas,monospace}
button{background:var(--nv);color:#0b1310;border:0;border-radius:7px;padding:8px 16px;font:600 13px system-ui;cursor:pointer;margin:10px 8px 0 0}button.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
.m{color:var(--muted);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--danger)}pre{white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,Consolas,monospace}
</style></head><body>
<header><b>FieldPilot</b><span class="m">settings</span><nav><a href="/desk">operator desk</a><a href="/sims">simulation lab</a><a href="/ops">field ops</a></nav></header>
<main>
<div class="card"><b>Nebius Token Factory (Nemotron)</b>
<div class="m" id="st">…</div>
<label>API key (stored only in this app's .env on this computer)</label><input id="k" type="password" autocomplete="off" placeholder="paste the key">
<label>Tavily key (optional)</label><input id="t" type="password" autocomplete="off" placeholder="leave blank to keep the current one">
<button id="save">Save</button><button class="alt" id="test">Test the key (one tiny call)</button>
<pre id="out" class="m"></pre></div>
<div class="m">The test makes a single request to the fast Nemotron model. It checks the key, the model list and the account balance.</div>
</main>
<script>
const $=s=>document.querySelector(s);
async function load(){const s=await (await fetch("/api/settings")).json();$("#st").textContent="Nebius key: "+s.nebius_api_key+" · Tavily key: "+s.tavily_api_key+" · "+s.base_url}
$("#save").onclick=async()=>{const r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nebius_api_key:$("#k").value,tavily_api_key:$("#t").value})});const j=await r.json();
 $("#out").className=r.ok?"ok":"bad";$("#out").textContent=r.ok?"Saved: "+j.saved.join(", "):(j.detail||"failed");if(r.ok){$("#k").value="";$("#t").value="";load()}};
$("#test").onclick=async()=>{$("#out").className="m";$("#out").textContent="Calling Token Factory…";const j=await (await fetch("/api/settings/test",{method:"POST"})).json();
 $("#out").className=j.ok?"ok":"bad";$("#out").textContent=j.ok?`OK · agent ${j.agent}\nvision ${j.vision}\nfast ${j.fast}\nmodels visible: ${j.models_seen}\nreply: ${j.reply}`:(j.error||j.detail)};
load();
</script></body></html>
